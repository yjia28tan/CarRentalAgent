# Non-secret settings. Any key can be overridden by an env var of the same name (upper-case)
# or by secrets.env. Secrets (JWT_SECRET, DSNs, LLM_API_KEY) belong in secrets.env only.

app_env: dev
log_level: INFO
# text = readable multi-line logs; json = one JSON object per line (use for log collectors)
log_format: text
default_timezone: America/Vancouver
company_name: Maple Car Rental
openapi_docs: true
cors_origins:
  - http://localhost:8501
allowed_hosts:
  - "*"

jwt_issuer: car-rental-agent
jwt_ttl_seconds: 3600

mongo_db: car_rental_agent

mock_services_url: http://mock_services:8001
agent_api_url: http://app:8000

llm_provider: azure_openai
llm_timeout_seconds: 30
llm_max_retries: 2

# custom = framework-free loop (default); langgraph = same tools/validation run as a LangGraph graph
agent_orchestrator: custom

agent_max_steps: 6
tool_timeout_seconds: 8
turn_timeout_seconds: 45
kb_min_score: 0.35
rate_limit_per_minute: 20
pending_action_ttl_seconds: 300
quote_ttl_seconds: 900

embedding_model: sentence-transformers/all-MiniLM-L6-v2
